<style>

<script>
var $=function(i){return document.getElementById(i);},COLS=26,ROWS=60,D,S,sel={c:0,r:0},anc=null,edit=false,hist=[],cache={};

/* ---- формулы: свой маленький разборщик, без eval ---- */

  MIN:function(a){var f=fl(a).filter(isN).map(Number);return f.length?Math.min.apply(0,f):0;},MAX:function(a){var f=fl(a).filter(isN).map(Number);return f.length?Math.max.apply(0,f):0;},

function fl(a){var o=[];a.forEach(function(x){if(Array.isArray(x))o=o.concat(fl(x));else o.push(x);});return o;}
function isN(x){return x!==''&&x!==null&&typeof x!=='boolean'&&!isNaN(x);}
function num(x){if(x===''||x===null)return 0;if(typeof x==='boolean')return x?1:0;var n=Number(x);if(isNaN(n))throw '#ЗНАЧ!';return n;}
function lex(s){var t=[],i=0,m;while(i<s.length){var r=s.slice(i);

var ERR_EN={'#ДЕЛ/0!':'#DIV/0!','#ЦИКЛ!':'#CYCLE!','#ЗНАЧ!':'#VALUE!','#ИМЯ?':'#NAME?','#ОШИБКА':'#ERROR','#ЧИСЛО!':'#NUM!'};
function er(t){return HL.indexOf('en')===0&&ERR_EN[t]?ERR_EN[t]:t;}

  if(Array.isArray(v))return {t:er('#ЗНАЧ!'),e:1};if(typeof v==='boolean')return {t:v?L('ИСТИНА','TRUE'):L('ЛОЖЬ','FALSE')};

</script>
<script>
function rng(){var a=anc||sel;return {c1:Math.min(a.c,sel.c),c2:Math.max(a.c,sel.c),r1:Math.min(a.r,sel.r),r2:Math.max(a.r,sel.r)};}

    e.style.fontWeight=x&&x.b?'700':'';e.style.fontStyle=x&&x.i?'italic':'';e.style.background=x&&x.f?x.f:'';e.style.textAlign=x&&x.a?{l:'left',m:'center',r:'right'}[x.a]:'';}
  var k2=id(sel.c,sel.r),cx=cell(k2);$('nm').textContent=g.c1===g.c2&&g.r1===g.r2?k2:id(g.c1,g.r1)+':'+id(g.c2,g.r2);if(document.activeElement!==$('fi'))$('fi').value=cx?cx.v:'';

function startEdit(init){var e=td(sel.c,sel.r),k=id(sel.c,sel.r),x=cell(k);edit=true;var i=document.createElement('input');i.value=init!==undefined?init:(x?x.v:'');e.textContent='';e.append(i);i.focus();

$('fi').addEventListener('input',function(){var e=td(sel.c,sel.r);e.textContent=this.value;});

  var p=document.createElement('button');p.textContent='+';p.onclick=function(){D.sheets.push({n:L('Лист','Sheet')+(D.sheets.length+1),c:{}});D.cur=D.sheets.length-1;S=D.sheets[D.cur];tabs();paint();save();};t.append(p);}
