name: Проверка в Chrome и Safari

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка совпадает с index.html
        run: |
          cp index.html /tmp/committed.html
          build/b.sh
          cmp index.html /tmp/committed.html || (echo "index.html не пересобран после изменений в build/. Запусти build/b.sh" && exit 1)
      - name: Playwright
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium webkit
      - name: Проверка (Chromium и WebKit, компьютер и iPhone)
        run: node tests/smoke.js
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
